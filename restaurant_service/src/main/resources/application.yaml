spring:
  application:
    name: restaurant_service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmunch_restaurants}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
     ddl-auto: update
    show-sql: true
    properties:
     hibernate:
      format_sql: true

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  port: 8082