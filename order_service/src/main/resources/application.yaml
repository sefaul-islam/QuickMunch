spring:
  application:
    name: order_service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmunch_orders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/quickmunch}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/quickmunch/protocol/openid-connect/certs}
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:order-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/quickmunch/protocol/openid-connect/token}
rabbitmq:
  exchange:
    order: order.exchange
  queue:
    order-created: order-created
    order-status-updated: order-status-updated  
    order-cancelled: order-cancelled
  routing-key:
    order-created: order.created
    order-status-updated: order.status.updated
    order-cancelled: order.cancelled

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}
restaurant-service:
  base-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8083

order:
  delivery-fee: ${ORDER_DELIVERY_FEE:2.99}
