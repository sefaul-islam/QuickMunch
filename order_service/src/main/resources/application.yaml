spring:
  application:
    name: order_service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickmunch_orders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

rabbitmq:
  exchange:
    order: order.exchange
  queue:
    order-created: order-created
    order-status-updated: order-status-updated  
    order-cancelled: order-cancelled
  routing-key:
    order-created: order.created
    order-status-updated: order.status.updated
    order-cancelled: order.cancelled

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8081}
restaurant-service:
  base-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:f4a8b2c9d1e6f3a7b5c0d2e8f1a4b7c9d3e6f0a2b5c8d1e4f7a0b3c6d9e2f5}

order:
  delivery-fee: ${ORDER_DELIVERY_FEE:2.99}
