spring:
  datasource:
    url: jdbc:h2:mem:order_test_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        generate_statistics: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/quickmunch
      client:
        registration:
          keycloak-client:
            provider: keycloak
            client-id: order-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/quickmunch/protocol/openid-connect/token

rabbitmq:
  exchange:
    order: order.exchange
  queue:
    order-created: order-created
    order-status-updated: order-status-updated
    order-cancelled: order-cancelled
  routing-key:
    order-created: order.created
    order-status-updated: order.status.updated
    order-cancelled: order.cancelled

user-service:
  base-url: http://localhost:8081
restaurant-service:
  base-url: http://localhost:8082

order:
  delivery-fee: 2.99
