
server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # User Service
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            # Restaurant Service
            - id: restaurant-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/restaurants/**

            # Order Service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/quickmunch
management:
  endpoints:
    web:
      exposure:
        include: health,info
