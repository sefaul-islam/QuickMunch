# Test config uses H2 in-memory database to avoid needing PostgreSQL for tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Use a static public key for tests (avoids needing a running Keycloak)
          # Tests should use @MockBean JwtDecoder or spring-security-test JWT support
          issuer-uri: http://localhost:8180/realms/quickmunch

server:
  port: 8081

cors:
  allowed-origins: http://localhost:3000
